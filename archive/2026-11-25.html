<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アニメ業界ヘッドライン</title>
<meta name="description" content="アニメ業界のニュースと作り手の声を、毎朝1号にまとめたヘッドライン。縦にスクロールで次のカット、横にめくると解説。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="アニメ業界ヘッドライン">
<meta property="og:title" content="アニメ業界ヘッドライン">
<meta property="og:description" content="アニメ業界のニュースと作り手の声を、毎朝1号にまとめたヘッドライン。">
<meta property="og:url" content="https://yodaimail-debug.github.io/anime-headline/">
<meta property="og:image" content="https://yodaimail-debug.github.io/anime-headline/og-top.png">
<meta property="og:image:alt" content="アニメ業界ヘッドライン：縦スクロールで読む、アニメ業界のニュース。">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="アニメ業界ヘッドライン">
<meta name="twitter:description" content="アニメ業界のニュースと作り手の声を、毎朝1号にまとめたヘッドライン。">
<meta name="twitter:image" content="https://yodaimail-debug.github.io/anime-headline/og-top.png">
<link rel="manifest" href="/anime-headline/manifest.webmanifest">
<meta name="theme-color" content="#fffdf8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="業界ヘッドライン">
<link rel="apple-touch-icon" href="/anime-headline/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/anime-headline/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6; --card:#fffdf8; --ink:#1b1f2a; --sub:#6a7183; --soft:#f5f7fb; --line:#e3e7ef;
  --c-news:#2f6bff; --c-work:#ff8a1f; --c-voice:#ff3f8e; --yellow:#ffd84a;
  --accent:var(--c-news);
  --jp:"M PLUS Rounded 1c",system-ui,sans-serif;
  --num:"Dela Gothic One","M PLUS Rounded 1c",system-ui,sans-serif;
  --ink2:#1b1f2a;
  --top:104px; --bottom:84px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;color-scheme:light}
body{font-family:var(--jp);color:var(--ink);background-color:var(--bg);background-image:radial-gradient(rgba(27,31,42,.07) 1px,transparent 1.3px);background-size:7px 7px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.jp{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}

/* ===== ヘッダー ===== */
header{position:fixed;inset:0 0 auto 0;z-index:20;background:rgba(255,253,248,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2.5px solid var(--ink)}
.mast{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 6px}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.mark{flex:0 0 30px;height:30px;border-radius:10px;background:var(--ink);display:grid;place-items:center}
.mark::before{content:"";border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.logo b{font-family:var(--num);font-weight:400;font-size:16px;white-space:nowrap;letter-spacing:.02em}
.logo b span{color:var(--c-news)}
.right{display:flex;align-items:center;gap:6px}
.date{font-family:var(--num);font-weight:400;font-size:12px;background:var(--yellow);border:2px solid var(--ink);border-radius:99px;padding:5px 11px;white-space:nowrap}
.help{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--ink);font-family:var(--num)}
/* 進行バー（カットごとの区切り） */
.progress{display:flex;gap:3px;padding:2px 14px 8px}
.progress i{flex:1;height:6px;border-radius:99px;background:#e6e0d2;transition:background .25s}
.progress i.done{background:color-mix(in srgb,var(--ink) 55%,var(--line))}
.progress i.on{background:var(--c,var(--ink))}
.chips{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{font-size:12px;font-weight:800;white-space:nowrap;padding:4px 12px;border-radius:99px;background:#fff;border:2px solid var(--ink);color:var(--ink)}
.chips button i{font-style:normal;font-family:var(--num);font-weight:400;margin-left:4px;font-size:11px}
.chips button[aria-pressed=true]{background:var(--dot,var(--ink));border-color:var(--dot,var(--ink));color:#fff}

/* ===== 縦スクロール ===== */
main{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.card{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;padding:calc(var(--top) + 10px) 14px calc(var(--bottom) + 6px);display:flex;flex-direction:column}
.card[hidden]{display:none}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border:2.5px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;
  opacity:.001;transform:translateY(18px) scale(.985);transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.card.in .sheet{opacity:1;transform:none}

/* カット表のような上帯 */
.slate{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;background-color:var(--accent);background-image:radial-gradient(rgba(255,255,255,.28) 1.4px,transparent 1.8px);background-size:8px 8px;background-position:right;color:#fff;border-bottom:2.5px solid var(--ink)}
.cut{font-family:var(--num);font-weight:400;font-size:22px;line-height:1;color:#fff;text-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.cut big{font-size:inherit}
.cat{font-weight:800;font-size:13px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:1px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc{margin-left:auto;font-family:var(--num);font-weight:600;font-size:12px;opacity:.9;white-space:nowrap}
.tc::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:6px;vertical-align:1px;animation:rec 1.6s infinite}
@keyframes rec{50%{opacity:.25}}

/* 横めくり */
.pages{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:18px 18px 16px;display:flex;flex-direction:column}
.page::-webkit-scrollbar{display:none}
.inner{max-width:560px;width:100%;margin:auto;display:flex;flex-direction:column;gap:14px}

.area{align-self:flex-start;font-size:12px;font-weight:800;color:var(--accent);background:#fff;border:2px solid var(--accent);border-radius:99px;padding:2px 10px}
h2{font-family:var(--num);font-weight:400;font-size:clamp(23px,6.5vw,33px);line-height:1.42;letter-spacing:.01em;text-wrap:balance}
h2 em{font-style:normal;background:linear-gradient(transparent 60%,var(--yellow) 60%,var(--yellow) 94%,transparent 94%)}
.lead{font-size:15.5px;line-height:1.9;color:#3a4152;font-weight:500;text-wrap:pretty}
.src{font-size:11.5px;color:var(--sub);font-weight:700;line-height:1.6}
.src a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.hint{align-self:flex-start;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink);background:var(--yellow);border:2px solid var(--ink);border-radius:99px;padding:5px 12px;box-shadow:2px 2px 0 var(--ink)}
.hint::after{content:"→";font-family:var(--num);animation:nudge 1.4s infinite}
@keyframes nudge{50%{transform:translateX(4px)}}

.label{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.06em}
.gist{background:color-mix(in srgb,var(--accent) 10%,#fff);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.85;font-weight:700}
.steps{list-style:none;display:flex;flex-direction:column;gap:12px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.steps li span:first-child{width:34px;height:34px;border-radius:12px;background:var(--accent);color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--num);font-size:15px}
.steps li p{font-size:15px;line-height:1.85;font-weight:500;padding-top:4px;text-wrap:pretty}

/* 文字量に合わせて文字サイズを調整し、どのニュースでも見た目の密度をそろえる */
.d-s .gist{font-size:18px}.d-s .steps li p{font-size:16.5px}.d-s .bubble{font-size:16px}.d-s .bubble b{font-size:18px}
.d-l .gist{font-size:14.5px;line-height:1.75}.d-l .steps li p{font-size:14px;line-height:1.75}.d-l .bubble{font-size:13.5px;line-height:1.7}.d-l .bubble b{font-size:15px}
/* コメント：チャット風 */
.chat{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-end}
.msg.r{flex-direction:row-reverse}
.av{flex:0 0 38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.msg.r .av{background:var(--ink)}
.bubble{position:relative;flex:1;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:12px 14px;font-size:14.5px;line-height:1.8;font-weight:500}
.bubble::before{content:"";position:absolute;bottom:12px;left:-9px;width:12px;height:12px;background:#fff;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.msg.r .bubble::before{left:auto;right:-9px;transform:rotate(-135deg)}
.kind{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--accent);border-radius:99px;padding:1px 9px;margin-bottom:4px}
.msg.r .kind{background:var(--ink)}
.bubble b{display:block;font-weight:800;font-size:16px;line-height:1.5;margin-bottom:2px}
.who{display:block;margin-top:6px;font-size:11.5px;font-weight:800}
.who span{color:var(--sub);font-weight:700}
.note{font-size:10.5px;color:var(--sub);line-height:1.7}

/* シート下部：ページ点とシェア */
.foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px 12px;border-top:2px dashed rgba(27,31,42,.15)}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:99px;background:#fff;border:2px solid var(--ink);transition:width .25s,background .25s}
.dots i.on{width:22px;background:var(--accent)}
.share{display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:99px;background:#fff;border:2px solid var(--ink);font-size:12px;font-weight:800;box-shadow:2px 2px 0 var(--ink)}
.share svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4}

/* ===== 下：フローティングの操作バー ===== */
footer{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;display:flex;justify-content:center;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:4px;background:var(--ink);color:#fff;border-radius:99px;padding:6px;border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--c-news)}
.pill button{height:44px;min-width:44px;border-radius:99px;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:15px}
.pill .count{padding:0 14px;font-family:var(--num);font-weight:400;font-size:15px;white-space:nowrap}
.pill .count small{opacity:.6;font-size:12px}
.pill .go{background:var(--yellow);color:var(--ink);padding:0 18px;font-family:var(--jp);font-weight:800;font-size:14px;gap:6px;display:flex}

/* ラインナップ・編集部より */
.h3{font-family:var(--num);font-weight:400;font-size:20px}
.lineup{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lineup button{width:100%;height:100%;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;line-height:1.5}
.lineup button span:first-child{font-family:var(--num);font-weight:400;font-size:12px;color:var(--c)}
.rules{list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.75;font-weight:500}
.rules li b{display:block;font-weight:800;color:var(--ink);font-size:13px;margin-bottom:2px}

/* 一覧シート（ラインナップ・バックナンバー） */
.dim{position:fixed;inset:0;z-index:40;background:rgba(27,31,42,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:78dvh;display:flex;flex-direction:column;background:var(--card);border-top:2.5px solid var(--ink);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:2px dashed rgba(27,31,42,.15)}
.dhead b{font-family:var(--num);font-weight:400;font-size:18px}
.dclose{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-weight:800}
.dbody{overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
.dlist{list-style:none;display:flex;flex-direction:column;gap:8px}
.dlist button,.dlist a{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700;line-height:1.5;text-decoration:none}
.dlist .n{font-family:var(--num);font-size:13px;color:var(--c,var(--ink))}
.dlist .k{font-size:10.5px;font-weight:800;color:#fff;background:var(--c,var(--ink));border-radius:99px;padding:1px 8px;white-space:nowrap}
.dlist .now{background:var(--yellow)}
.dnote{font-size:11.5px;color:var(--sub);line-height:1.7}
button.date{cursor:pointer}
button.date::after{content:" ▾"}
.pill .list{font-size:18px}
.ico{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:#fff;border:2px solid var(--ink);display:grid;place-items:center}
.ico svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(var(--bottom) + 18px);transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:99px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
/* ホーム画面に追加 */
.app{display:grid;place-items:center}
.app svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (display-mode:standalone){.app{display:none}}
/* 言語切り替え */
.lang{font-family:var(--num);font-size:10.5px;letter-spacing:.02em}
.langnote{margin:0 0 2px;font-size:11.5px;font-weight:700;color:var(--sub);text-align:center}
html[lang="en"] .jp{word-break:normal;overflow-wrap:break-word;line-break:auto;hyphens:auto}
/* ボタンが5つ並ぶので、狭い画面ではロゴとボタンを少し詰める */
.logo b{overflow:hidden;text-overflow:clip}
@media (max-width:430px){
  .mast{padding-left:12px;padding-right:12px}
  .logo{gap:7px}
  .logo b{font-size:13.5px}
  .right{gap:5px}
  .date{font-size:11.5px;padding:5px 9px}
  button.date::after{content:""}
  .help{width:28px;height:28px}
  .right{gap:4px}
  #gou .wd{display:none}
}
@media (max-width:380px){
  .mark{display:none}
  .logo b{font-size:13px}
}
@media (max-width:350px){
  .logo b{font-size:11.5px}
  .date{font-size:10.5px;padding:4px 7px}
}
.dlead{font-size:13.5px;font-weight:700;line-height:1.75}
.addsteps{list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:8px}
.addsteps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700;line-height:1.6}
.addsteps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--num);font-size:13px}
.installgo{width:100%;height:46px;border-radius:99px;background:var(--yellow);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:800;font-size:15px}

/* パソコンではスマホ1台分の幅で中央に表示 */
@media (min-width:520px){
  html{background:#d9d2c3}
  body{max-width:430px;margin:0 auto;box-shadow:0 0 0 2.5px var(--ink),0 0 40px rgba(27,31,42,.25)}
  header,footer,.drawer{left:calc(50% - 215px);right:calc(50% - 215px)}
}
@media (max-width:380px){.logo b{font-size:14.5px}.date{font-size:12px;padding:4px 9px}.page{padding:16px 14px 14px}}
@media (max-height:720px){:root{--top:98px;--bottom:74px}h2{font-size:clamp(21px,6vw,28px)}.lead,.steps li p{font-size:14px;line-height:1.75}.gist{font-size:14.5px}.inner{gap:10px}.pill button{height:38px;min-width:38px}.bubble{font-size:13.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.sheet{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <div class="mast">
    <div class="logo"><span class="mark" aria-hidden="true"></span><b id="logoText">アニメ業界<span>ヘッドライン</span></b></div>
    <div class="right"><button class="date" id="gou" aria-label="バックナンバーを開く"></button><button class="help lang" id="langBtn" aria-label="English">EN</button><button class="help app" id="appBtn" aria-label="ホーム画面に追加"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 8.5v7M8.5 12h7"/></svg></button><button class="help" id="howBtn" aria-label="この号の作り方">?</button></div>
  </div>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <nav class="chips" id="tabs" aria-label="ジャンル"></nav>
</header>

<main id="feed"></main>

<footer>
  <div class="pill">
    <button class="list" id="listBtn" aria-label="ラインナップを開く">☰</button>
    <button id="prevBtn" aria-label="前のカット">▲</button>
    <span class="count"><span id="cur">1</span><small> / <span id="tot">0</span></small></span>
    <button class="go" id="nextBtn"><span id="nextLabel">次のカットへ</span><span id="nextIcon">▼</span></button>
  </div>
</footer>
<div class="dim" id="dim"></div>
<section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle">
  <div class="dhead"><b id="dtitle"></b><button class="dclose" id="dclose" aria-label="閉じる">✕</button></div>
  <div class="dbody" id="dbody"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== 号データ（毎朝ここだけ差し替える） ===== */

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WK_EN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
/* 「11月27日」→「Nov 27」 */
const dateEn = s => EN ? String(s).replace(/(\d{1,2})月(\d{1,2})日/g,(_,m,d)=>`${MON[m-1]} ${+d}`) : s;

/* ===== この号の作り方（毎号共通。{…} は号データから自動で埋まる） ===== */
const TARGET = 20;
const MIX = {news:.55, work:.30, voice:.15};
const RULES = [
  "<b>鮮度</b>基本は24時間以内のニュース。今号は{range}から集め、{fresh}。",
  "<b>出典</b>会社の公式発表、通信社、アニメ専門メディアを優先。SNSだけが情報源の話題は「現場から」に回す。",
  "<b>選ぶ基準</b>アニメ業界のお金や仕組み、働き方が動いたかどうか。スタジオや資本、配信・興行の数字、制作現場の変化を重く見る。ゴシップや炎上ネタは扱わない。",
  "<b>見出し</b>派手さより中身。目立たなくても大事な話は、見出しでちゃんと伝える。",

  "<b>明るい話題</b>うれしいニュースを毎号2本以上入れる。",
  "<b>現場から</b>クレジットのある作り手本人が公開している発信だけ。噂、リーク、発売前のネタバレは載せない。"
];
const RULES_EN = [
  "<b>Freshness</b>Mostly news from the last 24 hours. This issue covers {range}; {fresh}.",
  "<b>Sources</b>Official company announcements, wire services and anime trade media come first. Stories that rest only on social media go to “From the field”.",
  "<b>What we pick</b>Whether money, structures or working conditions in the anime industry moved: studios and capital, streaming and box office numbers, changes on the production floor. No gossip or flame wars.",
  "<b>Headlines</b>Substance over hype. Quiet but important stories still get a clear headline.",
  "<b>Mix</b>About 20 stories per issue, split roughly 55:30:15 between industry news, new titles and voices from the field ({target} stories would be {targetMix}). This issue: {n} stories ({mix}).",
  "<b>Good news</b>At least two pieces of good news in every issue.",
  "<b>From the field</b>Only public posts by credited creators themselves. No rumors, leaks or spoilers before release."
];
const EDITOR_NOTE_EN = "For each story we try to gather two comments or analyses from different positions and outlets, and we do not pad when we cannot find them. Every item is a quick summary, so please check the linked sources for details. Story selection and summaries are made by AI (Anthropic's Claude) while checking the sources; the English edition is translated by the same AI. If anything differs, the source is correct.";
const VOICE_NOTE_EN = "Comments are summaries of what was said or analyzed, not direct quotes. ";
const FEW_NOTE_EN = "We could only confirm one voice from a different position this time, so we did not add more.";
const EDITOR_NOTE = "各カットのコメントや分析は、なるべく違う立場・違う媒体から2つずつ集めています。見つからないときは無理に足しません。どの記事も速報としての要約なので、くわしくは出典のリンク先で確かめてください。記事選びと要約は、AI（Anthropic社のClaude）が出典を確認しながら作っています。食い違いがあれば、出典の内容を正としてください。";
const VOICE_NOTE = "コメントは発言や分析の要約で、そのままの引用ではありません。";
const FEW_NOTE = "今回は別の立場の声を1つしか確認できなかったため、無理に増やしていません。";

/* ===== 以下は描画（毎日変えない） ===== */
const CATS = {news:[T.cats.news,"--c-news"], work:[T.cats.work,"--c-work"], voice:[T.cats.voice,"--c-voice"]};
const KIND = T.kind;
const $ = s => document.querySelector(s);
const feed = $("#feed");
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain = s => String(s).replace(/<[^>]+>/g,"");
const tc = sec => `${EN?"":"尺 "}${Math.floor(sec/60)}:${pad(sec%60)}`;

/* 日本語を文節ごとに区切り、文節の切れ目でだけ改行する */
const SEG = (typeof Intl!=="undefined" && Intl.Segmenter) ? new Intl.Segmenter("ja",{granularity:"word"}) : null;
const OPEN = /^[「『（(【〈《［\[“]+$/;
const GLUE = /^[ぁ-ゟー、。，．・：；！？!?」』）)】〉》］\]”…ー\s]+$/;
const NUMGLUE = (cur,w) =>
  (/[0-9０-９.,．]$/.test(cur) && /^[0-9０-９.,．%％万億兆千百十年月日時分秒本話期作人円位倍件歳回巻号週部館曲枚社分台割]/.test(w)) ||
  (/[–\-－/]$/.test(cur) && /^[0-9０-９]/.test(w)) ||
  (/[0-9０-９]$/.test(cur) && /^[–\-－/]/.test(w)) ||
  /(約|第|全|計|各|毎)$/.test(cur) ||
  (/[一-鿿々〆ヶァ-ヺーA-Za-z0-9０-９]$/.test(cur) && /^[一-鿿々〆ヶァ-ヺー]/.test(w)) ||
  (/[A-Za-z0-9.]$/.test(cur) && /^[A-Za-z0-9.]/.test(w)) ||
  (/[一-鿿々]$/.test(cur) && /^[A-Za-z]/.test(w));
function phraseText(str){
  str = String(str);
  if(!SEG || EN) return esc(str);
  const out = []; let cur = "";
  for(const {segment:w} of SEG.segment(str)){
    if(cur && (GLUE.test(w) || OPEN.test(cur) || NUMGLUE(cur,w))) cur += w;
    else { if(cur) out.push(cur); cur = w; }
  }
  if(cur) out.push(cur);
  return out.map(esc).join("<wbr>");
}
const phraseTitle = t => String(t).split(/(<em>.*?<\/em>)/).map(part=>{
  const m = part.match(/^<em>(.*)<\/em>$/);
  return m ? `<em>${phraseText(m[1])}</em>` : phraseText(part);
}).filter(Boolean).reduce((acc,h,i,arr)=>{
  const nextFirst = (arr[i+1]||"").replace(/^<em>/,"").charAt(0);
  return acc + h + (i<arr.length-1 && !GLUE.test(nextFirst) ? "<wbr>" : "");
},"");
const srcHtml = arr => arr.map(([n,u,d]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>${d?(EN?", ":"・")+esc(dateEn(d)):""}`).join(EN?" / ":"　");

(function(){
  const dt = new Date(ISSUE.date+"T12:00:00+09:00");
  const [, m, d] = ISSUE.date.split("-").map(Number);
  $("#gou").innerHTML = EN ? `${MON[m-1]} ${d}<span class="wd"> (${WK_EN[dt.getDay()]})</span>` : `${m}/${d}<span class="wd">(${"日月火水木金土"[dt.getDay()]})</span>号`;
})();

function rulesHtml(){
  const c = {news:0, work:0, voice:0};
  ISSUE.items.forEach(it=>c[it.cat]++);
  const label = o => EN ? `industry ${o.news}, new titles ${o.work}, from the field ${o.voice}` : `業界ニュース${o.news}・新作/作品${o.work}・現場から${o.voice}`;
  const t = {news:Math.round(TARGET*MIX.news), work:Math.round(TARGET*MIX.work)}; t.voice = TARGET-t.news-t.work;
  const E = (EN && ISSUE.en) || {};
  const map = EN
    ? {range:E.range||ISSUE.range, fresh:E.freshnessNote||(ISSUE.freshnessNote?ISSUE.freshnessNote:"almost everything is from the last 24 hours"), target:TARGET, targetMix:label(t), n:ISSUE.items.length, mix:label(c)}
    : {range:ISSUE.range, fresh:ISSUE.freshnessNote||"ほぼすべてが直近24時間の情報", target:TARGET, targetMix:label(t), n:ISSUE.items.length, mix:label(c)};
  return (EN?RULES_EN:RULES).map(r=>{
    const filled = r.replace(/\{(\w+)\}/g,(_,k)=>map[k]);
    const [head, ...rest] = filled.split("</b>");
    return `<li class="jp">${head}</b>${phraseText(rest.join("</b>"))}</li>`;
  }).join("");
}

const ICONS = {
  news:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h6M7 13h10M7 16h7"/></svg>',
  work:'<svg viewBox="0 0 24 24"><path d="M4 9h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 9l2.5-5 3 1.2L7 9M10 9l2.5-5 3 1.2L13 9M16 9l2.5-5 1.5.6V9"/></svg>',
  voice:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-4 3v-3H4z"/><path d="M8 9h8M8 12h5"/></svg>'
};
const shareIcon = `<svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/></svg>`;

function render(){
  let html = "";
  VIEW.forEach((it,i)=>{
    const n = i+1, [catName, color] = CATS[it.cat];
    const pages = [];
    const more = it.gist || it.details.length || it.voices.length;
    pages.push(`<section class="page"><div class="inner">
      <span class="area">${esc(it.area)}</span>
      <h2 class="jp">${phraseTitle(it.title)}</h2>
      <p class="lead jp">${phraseText(it.lead)}</p>
      <p class="src">${T.src}${srcHtml(it.src)}</p>
      ${more?`<button class="hint" data-flip>${T.flip}</button>`:""}
    </div></section>`);
    const dens = n => { n = EN ? n/2.3 : n; return n<90 ? "d-s" : n>210 ? "d-l" : "d-m"; };
    if(it.gist || it.details.length){
      const len = (it.gist||"").length + it.details.join("").length;
      pages.push(`<section class="page ${dens(len)}"><div class="inner">
        ${it.gist?`<p class="label">${T.summary}</p><p class="gist jp">${phraseText(it.gist)}</p>`:""}
        ${it.details.length?`<p class="label">${T.context}</p><ol class="steps">${it.details.map((d,j)=>`<li><span>${j+1}</span><p class="jp">${phraseText(d)}</p></li>`).join("")}</ol>`:""}
        ${it.dsrc?`<p class="src">${T.src}${srcHtml(it.dsrc)}</p>`:""}
      </div></section>`);
    }
    if(it.voices.length){
      const msgs = it.voices.map((v,j)=>`<div class="msg${j%2?" r":""}"><span class="av">${esc(v.who.slice(0,1))}</span>
        <div class="bubble"><span class="kind">${esc(KIND[v.kind]||v.kind)}</span><b class="jp">${phraseText(v.head)}</b><span class="jp">${phraseText(v.text)}</span>
        <span class="who">${esc(v.who)}${EN?"  ":"　"}<span>${esc(v.role)}</span></span>${v.src?`<span class="src">${T.src}${srcHtml(v.src)}</span>`:""}</div></div>`).join("");
      const vlen = it.voices.map(v=>v.head+v.text).join("").length;
      pages.push(`<section class="page ${dens(vlen*0.8)}"><div class="inner"><p class="label">${T.voices}</p><div class="chat">${msgs}</div><p class="note">${EN?VOICE_NOTE_EN:VOICE_NOTE}${it.voices.length<2?(EN?FEW_NOTE_EN:FEW_NOTE):""}</p></div></section>`);
    }
    html += `<article class="card" id="n${pad(n)}" data-cat="${it.cat}" style="--accent:var(${color})" aria-label="${esc(plain(it.title))}">
      <div class="sheet">
        <div class="slate"><span class="ico">${ICONS[it.cat]}</span><span class="cut">#${pad(n)}</span><span class="cat">${esc(catName)}</span><span class="tc">${tc(it.sec)}</span></div>
        <div class="pages">${pages.join("")}</div>
        <div class="foot"><div class="dots" aria-hidden="true">${pages.length>1?pages.map((_,j)=>`<i class="${j?"":"on"}"></i>`).join(""):""}</div>
          <button class="share" data-share="n${pad(n)}">${shareIcon}${T.share}</button></div>
      </div>
    </article>`;
  });
  html += `<article class="card" id="end" data-cat="all" style="--accent:var(--ink)">
    <div class="sheet">
      <div class="slate"><span class="cut">END</span><span class="cat">${T.end}</span></div>
      <div class="pages">
        <section class="page"><div class="inner"><p class="h3">${T.lineup}</p>
          <ul class="lineup">${VIEW.map((it,i)=>`<li><button data-go="n${pad(i+1)}" style="--c:var(${CATS[it.cat][1]})"><span>CUT ${pad(i+1)}</span><span class="jp">${phraseText(plain(it.title))}</span></button></li>`).join("")}</ul>
          <button class="hint" data-flip>${T.flipEnd}</button>
        </div></section>
        <section class="page"><div class="inner"><p class="h3">${T.editors}</p>
          <ol class="rules">${rulesHtml()}</ol>
          <p class="note jp">${phraseText(EN?EDITOR_NOTE_EN:EDITOR_NOTE)}</p></div></section>
      </div>
      <div class="foot"><div class="dots" aria-hidden="true"><i class="on"></i><i></i></div></div>
    </div>
  </article>`;
  feed.innerHTML = (EN && !HAS_EN ? `<p class="langnote">${T.jaOnly}</p>` : "") + html;
}
/* 画面の固定文言 */
document.title = T.title;
$("#logoText").innerHTML = T.logo;
$("#tabs").setAttribute("aria-label", T.genre);
$("#listBtn").setAttribute("aria-label", T.list);
$("#prevBtn").setAttribute("aria-label", T.prev);
$("#dclose").setAttribute("aria-label", T.close);
$("#howBtn").setAttribute("aria-label", T.how);
$("#gou").setAttribute("aria-label", T.gouLabel);
$("#appBtn").setAttribute("aria-label", T.appBtn);
$("#langBtn").textContent = T.langBtn;
$("#langBtn").setAttribute("aria-label", T.langLabel);
$("#nextLabel").textContent = T.next;
render();
if(EN && !HAS_EN) setTimeout(()=>toast(T.jaOnly), 600);

/* ===== ジャンル ===== */
function renderTabs(active){
  const counts = {all:ISSUE.items.length};
  ISSUE.items.forEach(it=>counts[it.cat]=(counts[it.cat]||0)+1);
  const list = [["all",T.all,"--ink"],...Object.entries(CATS).map(([k,v])=>[k,v[0],v[1]])];
  $("#tabs").innerHTML = list.filter(([k])=>counts[k]).map(([k,l,c])=>`<button data-cat="${k}" style="--dot:var(${c})" aria-pressed="${k===active}">${l}<i>${counts[k]}</i></button>`).join("");
}
renderTabs("all");

const storyCards = () => [...feed.querySelectorAll(".card:not([hidden]):not(#end)")];
function renderProgress(){
  $("#progress").innerHTML = storyCards().map(c=>`<i data-id="${c.id}" style="--c:var(${CATS[c.dataset.cat][1]})"></i>`).join("");
}
renderProgress();

$("#tabs").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  const c = b.dataset.cat;
  renderTabs(c);
  feed.querySelectorAll(".card").forEach(s=>{ s.hidden = !(c==="all" || s.dataset.cat===c || s.id==="end"); });
  renderProgress();
  feed.scrollTo({top:0});
  current = feed.querySelector(".card:not([hidden])");
  update();
});

/* ===== 今どこを読んでいるか ===== */
let current = null;
function update(){
  if(!current) return;
  const vs = storyCards(), atEnd = current.id==="end";
  const idx = atEnd ? vs.length-1 : vs.indexOf(current);
  $("#tot").textContent = vs.length;
  $("#cur").textContent = atEnd ? "END" : idx+1;
  $("#nextLabel").textContent = atEnd ? T.top : T.next;
  $("#nextIcon").textContent = atEnd ? "▲" : "▼";
  [...$("#progress").children].forEach((p,j)=>{ p.classList.toggle("on", !atEnd && j===idx); p.classList.toggle("done", atEnd || j<idx); });
}
function setHash(id){ try{ history.replaceState(null,"","#"+id); }catch(_){} }
const io = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add("in"); current=e.target; update(); if(current.id!=="end") setHash(current.id); }
  });
},{root:feed,threshold:.55});
feed.querySelectorAll(".card").forEach(c=>io.observe(c));
/* 最初のカードはすぐ表示 */
requestAnimationFrame(()=>{ const f=feed.querySelector(".card"); if(f) f.classList.add("in"); });

function step(dir){
  const all = [...feed.querySelectorAll(".card:not([hidden])")];
  const i = all.indexOf(current);
  let t;
  if(dir>0) t = (current && current.id==="end") ? all[0] : all[Math.min(i+1, all.length-1)];
  else t = all[Math.max(i-1, 0)];
  t.scrollIntoView({behavior:"smooth"});
}
$("#nextBtn").addEventListener("click",()=>step(1));
$("#prevBtn").addEventListener("click",()=>step(-1));

/* ===== ページ点 ===== */
feed.querySelectorAll(".card").forEach(card=>{
  const p = card.querySelector(".pages"), dots = card.querySelectorAll(".dots i");
  if(dots.length<2) return;
  p.addEventListener("scroll",()=>{
    const k = Math.round(p.scrollLeft / p.clientWidth);
    dots.forEach((d,j)=>d.classList.toggle("on", j===k));
  },{passive:true});
});

/* ===== めくる・シェア・ラインナップ・作り方 ===== */
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1800); }
function pageUrl(){ const u = location.href.split("#")[0]; return /^https?:/.test(u) ? u : ""; }
document.addEventListener("click",async e=>{
  const f = e.target.closest("[data-flip]");
  if(f){ const p = f.closest(".pages"); p.scrollTo({left:p.scrollLeft + p.clientWidth, behavior:"smooth"}); return; }
  const s = e.target.closest("[data-share]");
  if(s){
    /* 記事ごとのシェア用ページ（見出し入りのカード画像つき）を使う */
    const SITE = "https://yodaimail-debug.github.io/anime-headline/";
    const enShare = EN && HAS_EN;
    const url = (ISSUE && /^\d{4}-\d{2}-\d{2}$/.test(ISSUE.date||""))
      ? SITE+"s/"+ISSUE.date+"/"+s.dataset.share+(enShare?"-en":"")+".html"
      : (pageUrl() ? pageUrl()+"#"+s.dataset.share : "");
    if(!url){ toast(T.notYet); return; }
    const title = s.closest(".card").getAttribute("aria-label");
    try{
      if(navigator.share){ await navigator.share({title, url}); }
      else { await navigator.clipboard.writeText(url); toast(T.copied); }
    }catch(_){ /* キャンセル時は何もしない */ }
    return;
  }
  const g = e.target.closest("[data-go]");
  if(g){ const t = document.getElementById(g.dataset.go); if(t) t.scrollIntoView({behavior:"smooth"}); }
});
$("#howBtn").addEventListener("click",()=>{
  const end = $("#end"); end.scrollIntoView({behavior:"smooth"});
  setTimeout(()=>{ const p=end.querySelector(".pages"); p.scrollTo({left:p.scrollWidth,behavior:"smooth"}); },450);
});

/* ===== 一覧シート ===== */
function openDrawer(title, html){
  $("#dtitle").textContent = title; $("#dbody").innerHTML = html;
  $("#dim").classList.add("on"); $("#drawer").classList.add("on");
}
function closeDrawer(){ $("#dim").classList.remove("on"); $("#drawer").classList.remove("on"); }
$("#dim").addEventListener("click",closeDrawer);
$("#dclose").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });

/* ホーム画面に追加：アプリのように全画面で開ける。一度開いた号は電波が弱くても読める */
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
window.addEventListener("appinstalled", () => { installEvt = null; closeDrawer(); toast(T.added); });
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (navigator.standalone === true) $("#appBtn").style.display = "none";
$("#appBtn").addEventListener("click", () => {
  const go = installEvt ? `<button class="installgo" id="installGo">${T.appGo}</button>` : "";
  const steps = `<ol class="addsteps">${(isIOS?T.appIOS:T.appOther).map(x=>`<li>${x}</li>`).join("")}</ol>`;
  const other = `<p class="dnote">${isIOS?T.appIOSNote:T.appOtherNote}</p>`;
  openDrawer(T.appTitle, `<p class="dlead">${T.appLead}</p>${go}${steps}${other}`);
  const b = $("#installGo");
  if (b) b.addEventListener("click", async () => { installEvt.prompt(); try { await installEvt.userChoice; } catch (_) {} installEvt = null; closeDrawer(); });
});
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("/anime-headline/sw.js", { scope: "/anime-headline/" }).catch(() => {}));
}

/* ラインナップ：どこからでも各ニュースへ */
$("#listBtn").addEventListener("click",()=>{
  const items = VIEW.map((it,i)=>{
    const id = "n"+pad(i+1), on = current && current.id===id;
    return `<li><button data-go="${id}" data-close class="${on?"now":""}" style="--c:var(${CATS[it.cat][1]})"><span class="n">#${pad(i+1)}</span><span class="jp">${phraseText(plain(it.title))}</span><span class="k">${esc(CATS[it.cat][0])}</span></button></li>`;
  }).join("");
  openDrawer(T.lineupTitle, `<ul class="dlist">${items}</ul>`);
});

/* 言語の切り替え：選んだ言語を覚えて、同じ場所のまま読み直す */
$("#langBtn").addEventListener("click",()=>{
  const next = EN ? "ja" : "en";
  try{ localStorage.setItem("ahl-lang", next); }catch(_){}
  const u = new URL(location.href); u.searchParams.set("lang", next);
  location.replace(u.href);
});

/* バックナンバー：archive/YYYY-MM-DD.html が公開されている日だけ並べる */
const IN_ARCHIVE = /\/archive\/[^/]*$/.test(location.pathname);
const ROOT = IN_ARCHIVE ? "../" : "./";
function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function jpLabel(s){ const d=new Date(s+"T12:00:00+09:00"); return EN ? `${MON[d.getMonth()]} ${d.getDate()} (${WK_EN[d.getDay()]})` : `${d.getMonth()+1}/${d.getDate()}(${"日月火水木金土"[d.getDay()]})号`; }
async function exists(url){
  if(!/^https?:/.test(location.href)) return false;
  try{ const r = await fetch(url,{method:"HEAD",cache:"no-store"}); return r.ok; }catch(_){ return false; }
}
$("#gou").addEventListener("click",async ()=>{
  openDrawer(T.backTitle, `<p class="dnote">${T.searching}</p>`);
  const base = new Date(ISSUE.date+"T12:00:00+09:00");
  const rel = T.yest;
  const rows = [`<li><a href="${ROOT}" class="${IN_ARCHIVE?"":"now"}"><span class="n">${T.latest}</span><span>${T.readLatest}</span><span class="k">TOP</span></a></li>`];
  const checks = [];
  for(let k=1;k<=7;k++){
    const d = new Date(base); d.setDate(d.getDate()-k);
    const s = ymd(d), url = `${ROOT}archive/${s}.html`;
    checks.push(exists(url).then(ok=> ok ? `<li><a href="${url}"><span class="n">${rel[k-1]||T.daysAgo(k)}</span><span>${jpLabel(s)}</span><span class="k">${T.read}</span></a></li>` : ""));
  }
  const found = (await Promise.all(checks)).filter(Boolean);
  const note = found.length ? "" : `<p class="dnote">${T.noBack}</p>`;
  $("#dbody").innerHTML = `<p class="dnote">${T.nowReading(jpLabel(ISSUE.date))}</p><ul class="dlist">${rows.join("")}${found.join("")}</ul>${note}`;
});
document.addEventListener("click",e=>{ if(e.target.closest("[data-close]")) closeDrawer(); });

if(location.hash){ const t=document.getElementById(location.hash.slice(1)); if(t) t.scrollIntoView(); }
</script>
</body>
