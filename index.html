<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アニメ業界ヘッドライン</title>
<meta name="description" content="アニメ業界のニュースと作り手の声を、毎朝1号にまとめたヘッドライン。縦にスクロールで次の話、横にめくると解説。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5efe2; --paper2:#fffcf4; --ink:#15120e; --sub:#615a4d; --line:#15120e;
  --red:#e23a2e; --yellow:#ffd23f; --blue:#2c6be0; --pink:#ff5c8a; --film:#1d1a16;
  --accent:var(--red);
  --head:"Dela Gothic One","M PLUS 1p",system-ui,sans-serif;
  --body:"M PLUS 1p",system-ui,sans-serif;
  --top:92px; --bottom:66px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;color-scheme:light}
body{
  font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;
  background-color:var(--paper);
  background-image:radial-gradient(rgba(21,18,14,.08) 1px,transparent 1.3px);
  background-size:6px 6px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.jp{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}

/* ===== ヘッダー：雑誌の題字＋チケット型の号数 ===== */
header{position:fixed;inset:0 0 auto 0;z-index:20;background:var(--paper2);border-bottom:3px solid var(--line)}
.mast{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 6px 14px}
.logo{display:flex;flex-direction:column;line-height:1;min-width:0}
.logo b{font-family:var(--head);font-weight:400;font-size:18px;white-space:nowrap}
.logo b span{color:var(--red)}
.logo small{font-size:9px;font-weight:800;letter-spacing:.22em;color:var(--sub);margin-top:3px;white-space:nowrap}
.right{display:flex;align-items:center;gap:6px}
.ticket{
  font-family:var(--head);font-size:12px;background:var(--yellow);padding:5px 12px;white-space:nowrap;
  -webkit-mask:radial-gradient(circle 5px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 5px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 5px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 5px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
}
.help{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);font-family:var(--head);font-size:14px;line-height:1;background:var(--paper2)}
.genres{display:flex;gap:6px;padding:6px 12px 8px;overflow-x:auto;scrollbar-width:none}
.genres::-webkit-scrollbar{display:none}
.genres button{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;white-space:nowrap;padding:4px 11px;border:2px solid var(--line);border-radius:99px;background:var(--paper2)}
.genres button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--ink))}
.genres button i{font-style:normal;font-size:11px;color:var(--sub)}
.genres button[aria-pressed=true]{background:var(--ink);color:var(--paper2)}
.genres button[aria-pressed=true] i{color:var(--yellow)}

/* ===== 縦にスクロール：1話＝1枚 ===== */
main{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.card{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;padding:calc(var(--top) + 10px) 12px calc(var(--bottom) + 8px);display:flex;flex-direction:column;gap:8px}
.card[hidden]{display:none}
.book{flex:1;min-height:0;display:flex;border:3px solid var(--line);background:var(--paper2);box-shadow:5px 5px 0 var(--line)}

/* 背表紙（縦書きのジャンル） */
.spine{flex:0 0 30px;background:var(--accent);border-right:3px solid var(--line);display:flex;align-items:center;justify-content:center}
.spine span{writing-mode:vertical-rl;font-family:var(--head);font-size:13px;color:#fff;letter-spacing:.18em;white-space:nowrap}

/* ===== 横にめくる：ページ ===== */
.pages{flex:1;min-width:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;position:relative;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:16px 16px 18px;display:flex;flex-direction:column}
.page::-webkit-scrollbar{display:none}
.page + .page{border-left:3px dashed rgba(21,18,14,.18)}
.inner{max-width:560px;width:100%;margin:auto;display:flex;flex-direction:column;gap:12px}

/* 表紙ページ */
.page.cover::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 85% 20%, rgba(21,18,14,.06) 0deg 1.1deg, transparent 1.1deg 5deg);
  -webkit-mask:radial-gradient(circle at 85% 20%, transparent 15%, #000 55%);
          mask:radial-gradient(circle at 85% 20%, transparent 15%, #000 55%);
}
.page > *{position:relative}
.no{display:flex;align-items:baseline;gap:8px}
.no b{font-family:var(--head);font-weight:400;font-size:44px;line-height:.9;color:var(--paper2);-webkit-text-stroke:2px var(--line);text-shadow:3px 3px 0 var(--accent)}
.no span{font-size:11px;font-weight:800;color:var(--sub)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:11px;font-weight:800;border:2px solid var(--line);padding:1px 8px;background:var(--paper2)}
.tags span:first-child{background:var(--ink);color:var(--paper2)}
h2{font-family:var(--head);font-weight:400;font-size:clamp(23px,6.6vw,34px);line-height:1.4;text-wrap:balance}
h2 em{font-style:normal;background:linear-gradient(transparent 60%,var(--yellow) 60%,var(--yellow) 94%,transparent 94%)}
.caption{background:var(--paper2);border:2.5px solid var(--line);padding:12px 14px;font-size:15px;line-height:1.85;font-weight:500;text-wrap:pretty;box-shadow:3px 3px 0 rgba(21,18,14,.15)}
.src{font-size:11.5px;color:var(--sub);font-weight:700;line-height:1.6}
.src a{text-decoration:underline;text-underline-offset:3px}

/* めくり（ページの角） */
.curl{position:absolute;right:0;bottom:0;width:58px;height:58px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 6px 5px 0;font-size:10px;font-weight:800;color:var(--ink);
  background:linear-gradient(135deg,transparent 49%,var(--line) 49% 52%,var(--yellow) 52%)}

/* 解説ページ：コマ割り */
.grid{display:grid;gap:10px}
.koma{border:2.5px solid var(--line);background:var(--paper2);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.koma:nth-child(even){margin-left:14px}
.koma:nth-child(odd):not(:first-child){margin-right:14px}
.ktag{align-self:flex-start;font-family:var(--head);font-size:12px;background:var(--accent);color:#fff;padding:2px 8px;border:2px solid var(--line);transform:rotate(-2deg)}
.koma p{font-size:15px;line-height:1.85;font-weight:500;text-wrap:pretty}
.koma.narr{background:var(--ink);color:var(--paper2);border-color:var(--ink)}
.koma.narr .ktag{background:var(--yellow);color:var(--ink)}
.koma.narr p{font-weight:700}

/* 声ページ：吹き出しの掛け合い */
.talk{display:flex;flex-direction:column;gap:18px}
.say{display:flex;gap:10px;align-items:flex-start}
.say.r{flex-direction:row-reverse}
.face{flex:0 0 40px;height:40px;border-radius:50%;border:2.5px solid var(--line);background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--head);font-size:15px}
.say.r .face{background:var(--blue)}
.bub{position:relative;flex:1;background:#fff;border:2.5px solid var(--line);border-radius:22px;padding:12px 14px;font-size:14.5px;line-height:1.8;font-weight:500}
.bub::before{content:"";position:absolute;top:14px;left:-11px;width:14px;height:14px;background:#fff;border-left:2.5px solid var(--line);border-bottom:2.5px solid var(--line);transform:rotate(45deg)}
.say.r .bub::before{left:auto;right:-11px;transform:rotate(-135deg)}
.bub .kind{display:inline-block;font-size:10.5px;font-weight:800;background:var(--yellow);border:2px solid var(--line);padding:0 6px;margin-bottom:4px}
.bub b{display:block;font-family:var(--head);font-weight:400;font-size:17px;line-height:1.45;margin-bottom:4px}
.bub .who{display:block;margin-top:6px;font-size:11.5px;font-weight:800}
.bub .who span{color:var(--sub);font-weight:700}
.note{font-size:10.5px;color:var(--sub);line-height:1.7}

/* カードの下：ページ番号とシェア */
.bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 0 4px;min-height:36px}
.pg{font-family:var(--head);font-size:12px;letter-spacing:.06em;display:flex;gap:4px}
.pg i{font-style:normal;width:22px;height:22px;display:grid;place-items:center;border:2px solid var(--line);background:var(--paper2)}
.pg i.on{background:var(--accent);color:#fff}
.share{height:34px;padding:0 12px;border:2.5px solid var(--line);background:var(--paper2);font-size:12px;font-weight:800;box-shadow:3px 3px 0 var(--line);display:flex;align-items:center;gap:6px}
.share svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4}
.share:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}

/* ===== フッター：フィルムストリップ ===== */
footer{position:fixed;inset:auto 0 0 0;z-index:20;height:calc(var(--bottom) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--film);display:flex;align-items:stretch}
.strip{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 10px;
  background:
    radial-gradient(circle 3px,var(--paper) 96%,transparent) 0 4px/14px 8px repeat-x,
    radial-gradient(circle 3px,var(--paper) 96%,transparent) 0 calc(100% - 4px)/14px 8px repeat-x,var(--film)}
.strip::-webkit-scrollbar{display:none}
.frame{flex:0 0 auto;min-width:34px;height:30px;padding:0 6px;border:2px solid #5c554a;background:#2a2621;color:#c9c0ad;font-family:var(--head);font-size:12px;display:grid;place-items:center}
.frame.c-news{border-bottom-color:var(--red)} .frame.c-work{border-bottom-color:var(--blue)} .frame.c-voice{border-bottom-color:var(--pink)}
.frame.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.frame.end{font-family:var(--body);font-weight:800;font-size:11px}
.next{flex:0 0 64px;background:var(--red);color:#fff;border-left:3px solid var(--line);font-family:var(--head);font-size:12px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.next big{font-size:18px}

/* 目次・編集部より */
.toc{list-style:none;display:flex;flex-direction:column}
.toc button{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:baseline;text-align:left;width:100%;padding:8px 0;font-size:14px;font-weight:700;border-bottom:2px dotted rgba(21,18,14,.3)}
.toc button span:first-child{font-family:var(--head);font-size:13px;color:var(--c,var(--red))}
.htitle{font-family:var(--head);font-size:20px;display:flex;align-items:center;gap:8px}
.htitle::after{content:"";flex:1;height:3px;background:var(--line)}
.rules{list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:r}
.rules li{counter-increment:r;padding-left:30px;position:relative;font-size:14px;line-height:1.75;font-weight:500}
.rules li::before{content:counter(r);position:absolute;left:0;top:1px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--paper2);font-family:var(--head);font-size:11px}
.rules li b{font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(var(--bottom) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--paper2);font-size:13px;font-weight:700;padding:8px 14px;border-radius:99px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
.toast.on{opacity:1}

@media (min-width:900px){.card{padding-left:14vw;padding-right:14vw}}
@media (max-width:380px){.logo b{font-size:15.5px}.logo small{letter-spacing:.12em}.ticket{font-size:11px;padding:5px 10px}.spine{flex-basis:26px}.page{padding:14px 12px 16px}}
@media (max-height:720px){:root{--bottom:58px}.no b{font-size:36px}h2{font-size:clamp(21px,6vw,28px)}.caption,.koma p{font-size:14px;line-height:1.75}.inner{gap:9px}.bub{font-size:13.5px}.bub b{font-size:15.5px}.frame{height:26px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="mast">
    <div class="logo"><b>アニメ業界<span>ヘッドライン</span></b><small>ANIME INDUSTRY HEADLINE</small></div>
    <div class="right"><span class="ticket" id="gou"></span><button class="help" id="howBtn" aria-label="この号の作り方">?</button></div>
  </div>
  <nav class="genres" id="tabs" aria-label="ジャンル"></nav>
</header>

<main id="feed"></main>

<footer>
  <nav class="strip" id="strip" aria-label="話数"></nav>
  <button class="next" id="nextBtn"><big id="nextIcon">▼</big><span id="nextLabel">次の話</span></button>
</footer>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== 号データ（毎朝ここだけ差し替える） ===== */

  (/[0-9０-９]$/.test(cur) && /^[–\-－/]/.test(w)) ||
  /(約|第|全|計|各|毎)$/.test(cur) ||
  (/[一-鿿々〆ヶァ-ヺーA-Za-z0-9０-９]$/.test(cur) && /^[一-鿿々〆ヶァ-ヺー]/.test(w)) ||
  (/[A-Za-z0-9.]$/.test(cur) && /^[A-Za-z0-9.]/.test(w)) ||
  (/[一-鿿々]$/.test(cur) && /^[A-Za-z]/.test(w));
function phraseText(str){
  str = String(str);
  if(!SEG) return esc(str);
  const out = []; let cur = "";
  for(const {segment:w} of SEG.segment(str)){
    if(cur && (GLUE.test(w) || OPEN.test(cur) || NUMGLUE(cur,w))) cur += w;
    else { if(cur) out.push(cur); cur = w; }
  }
  if(cur) out.push(cur);
  return out.map(esc).join("<wbr>");
}
const phraseTitle = t => String(t).split(/(<em>.*?<\/em>)/).map(part=>{
  const m = part.match(/^<em>(.*)<\/em>$/);
  return m ? `<em>${phraseText(m[1])}</em>` : phraseText(part);
}).filter(Boolean).reduce((acc,h,i,arr)=>{
  const nextFirst = (arr[i+1]||"").replace(/^<em>/,"").charAt(0);
  return acc + h + (i<arr.length-1 && !GLUE.test(nextFirst) ? "<wbr>" : "");
},"");
const srcHtml = arr => arr.map(([n,u,d]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>${d?"・"+esc(d):""}`).join("　");

(function(){
  const dt = new Date(ISSUE.date+"T12:00:00+09:00");
  const w = "日月火水木金土"[dt.getDay()];
  const [, m, d] = ISSUE.date.split("-").map(Number);
  $("#gou").textContent = `${m}.${d} ${w}曜号`;
})();

function rulesHtml(){
  const c = {news:0, work:0, voice:0};
  ISSUE.items.forEach(it=>c[it.cat]++);
  const label = o => `業界ニュース${o.news}・新作/作品${o.work}・現場から${o.voice}`;
  const t = {news:Math.round(TARGET*MIX.news), work:Math.round(TARGET*MIX.work)}; t.voice = TARGET-t.news-t.work;
  const map = {range:ISSUE.range, fresh:ISSUE.freshnessNote||"ほぼすべてが直近24時間の情報", target:TARGET, targetMix:label(t), n:ISSUE.items.length, mix:label(c)};
  return RULES.map(r=>{
    const filled = r.replace(/\{(\w+)\}/g,(_,k)=>map[k]);
    const [head, ...rest] = filled.split("</b>");
    return `<li class="jp">${head}</b>${phraseText(rest.join("</b>"))}</li>`;
  }).join("");
}

function render(){
  let html = "";
  const total = ISSUE.items.length;
  ISSUE.items.forEach((it,i)=>{
    const n = i+1, [catName, color] = CATS[it.cat];
    const pages = [];
    const hasMore = it.gist || it.details.length || it.voices.length;
    pages.push(`<section class="page cover"><div class="inner">
      <div class="no"><b>#${pad(n)}</b><span>/ ${total}話</span></div>
      <div class="tags"><span>${esc(catName)}</span><span>${esc(it.area)}</span><span>約${it.sec}秒</span></div>
      <h2 class="jp">${phraseTitle(it.title)}</h2>
      <p class="caption jp">${phraseText(it.lead)}</p>
      <p class="src">出典：${srcHtml(it.src)}</p>
    </div>${hasMore?'<button class="curl" data-flip aria-label="次のページ">めくる</button>':""}</section>`);
    if(it.gist || it.details.length){
      const komas = [];
      if(it.gist) komas.push(`<div class="koma narr"><span class="ktag">あらすじ</span><p class="jp">${phraseText(it.gist)}</p></div>`);
      it.details.forEach((d,j)=>komas.push(`<div class="koma"><span class="ktag">解説 その${j+1}</span><p class="jp">${phraseText(d)}</p></div>`));
      pages.push(`<section class="page"><div class="inner"><div class="grid">${komas.join("")}</div>${it.dsrc?`<p class="src">出典：${srcHtml(it.dsrc)}</p>`:""}</div>${it.voices.length?'<button class="curl" data-flip aria-label="次のページ">めくる</button>':""}</section>`);
    }
    if(it.voices.length){
      const says = it.voices.map((v,j)=>`<div class="say${j%2?" r":""}"><span class="face">${esc(v.who.slice(0,1))}</span>
        <div class="bub"><span class="kind">${esc(KIND[v.kind]||v.kind)}</span><b class="jp">${phraseText(v.head)}</b><span class="jp">${phraseText(v.text)}</span>
        <span class="who">${esc(v.who)}　<span>${esc(v.role)}</span></span>
        ${v.src?`<span class="src">出典：${srcHtml(v.src)}</span>`:""}</div></div>`).join("");
      pages.push(`<section class="page"><div class="inner"><div class="talk">${says}</div><p class="note">${VOICE_NOTE}${it.voices.length<2?FEW_NOTE:""}</p></div></section>`);
    }
    html += `<article class="card" id="n${pad(n)}" data-cat="${it.cat}" style="--accent:var(${color})" aria-label="${esc(plain(it.title))}">
      <div class="book"><div class="spine"><span>${esc(catName)}・${esc(it.area)}</span></div><div class="pages">${pages.join("")}</div></div>
      <div class="bar"><div class="pg" aria-hidden="true">${pages.length>1?pages.map((_,j)=>`<i class="${j?"":"on"}">${j+1}</i>`).join(""):""}</div>
      <button class="share" data-share="n${pad(n)}"><svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/></svg>この話をシェア</button></div>
    </article>`;
  });
  html += `<article class="card" id="end" data-cat="all" style="--accent:var(--ink)">
    <div class="book"><div class="spine"><span>目次・編集部より</span></div><div class="pages">
      <section class="page"><div class="inner"><p class="htitle">目次</p>
        <ul class="toc">${ISSUE.items.map((it,i)=>`<li><button data-go="n${pad(i+1)}" style="--c:var(${CATS[it.cat][1]})"><span>#${pad(i+1)}</span><span class="jp">${phraseText(plain(it.title))}</span></button></li>`).join("")}</ul>
      </div><button class="curl" data-flip aria-label="次のページ">めくる</button></section>
      <section class="page"><div class="inner"><p class="htitle">編集部より</p>
        <ol class="rules">${rulesHtml()}</ol>
        <p class="note jp">${phraseText(EDITOR_NOTE)}</p></div></section>
    </div></div>
    <div class="bar"><div class="pg" aria-hidden="true"><i class="on">1</i><i>2</i></div></div>
  </article>`;
  feed.innerHTML = html;
}
render();

/* ===== ジャンル ===== */
function renderTabs(active){
  const counts = {all:ISSUE.items.length};
  ISSUE.items.forEach(it=>counts[it.cat]=(counts[it.cat]||0)+1);
  const list = [["all","ぜんぶ","--ink"],...Object.entries(CATS).map(([k,v])=>[k,v[0],v[1]])];
  $("#tabs").innerHTML = list.filter(([k])=>counts[k]).map(([k,l,c])=>`<button data-cat="${k}" style="--dot:var(${c})" aria-pressed="${k===active}">${l}<i>${counts[k]}</i></button>`).join("");
}
renderTabs("all");

/* ===== フィルムストリップ ===== */
function renderStrip(){
  const cards = [...feed.querySelectorAll(".card:not([hidden])")];
  $("#strip").innerHTML = cards.map(c=>{
    if(c.id==="end") return `<button class="frame end" data-go="end">目次</button>`;
    return `<button class="frame c-${c.dataset.cat}" data-go="${c.id}">${c.id.slice(1)}</button>`;
  }).join("");
}
renderStrip();

$("#tabs").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  const c = b.dataset.cat;
  renderTabs(c);
  feed.querySelectorAll(".card").forEach(s=>{ s.hidden = !(c==="all" || s.dataset.cat===c || s.id==="end"); });
  renderStrip();
  feed.scrollTo({top:0});
  current = feed.querySelector(".card:not([hidden])");
  update();
});

/* ===== 今どこを読んでいるか ===== */
let current = null;
function update(){
  if(!current) return;
  const atEnd = current.id==="end";
  $("#nextIcon").textContent = atEnd ? "▲" : "▼";
  $("#nextLabel").textContent = atEnd ? "最初へ" : "次の話";
  const strip = $("#strip");
  strip.querySelectorAll(".frame").forEach(f=>f.classList.toggle("on", f.dataset.go===current.id));
  const on = strip.querySelector(".frame.on");
  if(on) strip.scrollTo({left: on.offsetLeft - strip.clientWidth/2 + on.clientWidth/2, behavior:"smooth"});
}
/* プレビュー環境などでは履歴の書き換えができないので、失敗しても止めない */
function setHash(id){ try{ history.replaceState(null,"","#"+id); }catch(_){} }
const io = new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ current=e.target; update(); if(current.id!=="end") setHash(current.id); } });
},{root:feed,threshold:.6});
feed.querySelectorAll(".card").forEach(c=>io.observe(c));

$("#nextBtn").addEventListener("click",()=>{
  const all = [...feed.querySelectorAll(".card:not([hidden])")];
  const i = all.indexOf(current);
  const target = (current && current.id==="end") ? all[0] : all[Math.min(i+1, all.length-1)];
  target.scrollIntoView({behavior:"smooth"});
});

/* ===== ページ番号 ===== */
feed.querySelectorAll(".card").forEach(card=>{
  const p = card.querySelector(".pages"), dots = card.querySelectorAll(".pg i");
  if(dots.length<2) return;
  p.addEventListener("scroll",()=>{
    const k = Math.round(p.scrollLeft / p.clientWidth);
    dots.forEach((d,j)=>d.classList.toggle("on", j===k));
  },{passive:true});
});

/* ===== めくる・シェア・目次・作り方 ===== */
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1800); }
function pageUrl(){ const u = location.href.split("#")[0]; return /^https?:/.test(u) ? u : ""; }
document.addEventListener("click",async e=>{
  const f = e.target.closest("[data-flip]");
  if(f){ const p = f.closest(".pages"); p.scrollTo({left:p.scrollLeft + p.clientWidth, behavior:"smooth"}); return; }
  const s = e.target.closest("[data-share]");
  if(s){
    const base = pageUrl();
    if(!base){ toast("公開後のページでシェアできます"); return; }
    const url = base+"#"+s.dataset.share, title = s.closest(".card").getAttribute("aria-label");
    try{
      if(navigator.share){ await navigator.share({title, url}); }
      else { await navigator.clipboard.writeText(url); toast("リンクをコピーしました"); }
    }catch(_){ /* キャンセル時は何もしない */ }
    return;
  }
  const g = e.target.closest("[data-go]");
  if(g){ const t = document.getElementById(g.dataset.go); if(t) t.scrollIntoView({behavior:"smooth"}); }
});
$("#howBtn").addEventListener("click",()=>{
  const end = $("#end"); end.scrollIntoView({behavior:"smooth"});
  setTimeout(()=>{ const p=end.querySelector(".pages"); p.scrollTo({left:p.scrollWidth,behavior:"smooth"}); },450);
});

/* #n03 などのリンクで開いたとき */
if(location.hash){ const t=document.getElementById(location.hash.slice(1)); if(t) t.scrollIntoView(); }
</script>
